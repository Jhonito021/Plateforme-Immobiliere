<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ImmoLoc - Trouvez votre bien idéal</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="header" id="header">
        <div class="container header-content">
            <a href="#" class="logo">
                <i class="fa-solid fa-house-chimney"></i>
                <span>Immo <span class="accent">Loc</span></span>
            </a>

            <nav class="nav" id="nav">
                <a href="#accueil" class="nav-link active">Accueil</a>
                <a href="#biens" class="nav-link">Biens</a>
                <a href="#services" class="nav-link">Services</a>
                <a href="#contact" class="nav-link">Contact</a>
            </nav>

            <div class="header-actions">
                <button class="theme-toggle" id="themeToggle" aria-label="Changer de thème">
                    <i class="fa-solid fa-moon"></i>
                </button>
                <button class="btn btn-otline hide-mobile">
                    <i class="fa-solid fa-user"></i> Connexion
                </button>
                <button class="menu-toggle" id="menuToggle" aria-label="Menu">
                    <i class="fa-solid fa-bars"></i>

    <script src="js/script.js"></script>
